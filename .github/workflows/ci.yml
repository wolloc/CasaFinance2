name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E smoke tests
        run: npm run test:e2e

      - name: Secret scan
        run: npm run check:secrets

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

  database-security:
    name: Supabase RLS and database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize local Supabase config
        run: test -f supabase/config.toml || supabase init

      - name: Start isolated Supabase and replay every migration from zero
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Run Marco 3 dynamic RLS security gate
        run: supabase test db supabase/tests/marco3_rls_security.test.sql

      - name: Export local Supabase public connection settings
        run: |
          supabase status -o env > /tmp/supabase.env
          while IFS='=' read -r key value; do
            case "$key" in
              API_URL|PUBLISHABLE_KEY|ANON_KEY)
                value="${value#\"}"
                value="${value%\"}"
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < /tmp/supabase.env

      - name: Run Marco 3 Auth JWT and PostgREST gate
        run: bash supabase/tests/marco3_auth_http.sh
