name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      database: ${{ steps.changes.outputs.database }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify change risk
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          app=false
          browser=false
          database=false
          dependencies=false

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            app=true
            browser=true
            database=true
            dependencies=true
            printf '%s\n' '[ci] manual run: full validation'
          else
            git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}" > /tmp/changed-files.txt
            printf '%s\n' '[ci] changed files:'
            cat /tmp/changed-files.txt

            while IFS= read -r file; do
              case "${file}" in
                package.json|package-lock.json)
                  app=true
                  dependencies=true
                  ;;
                src/*|server/*|tests/*|scripts/*|supabase/*|vite.config.*|tsconfig*.json|playwright.config.*)
                  app=true
                  ;;
              esac

              case "${file}" in
                src/components/*|src/context/*|src/App*|src/main*|tests/e2e/*|playwright.config.*)
                  browser=true
                  ;;
              esac

              case "${file}" in
                src/finance/*.test.ts|src/domain/*.test.ts)
                  ;;
                supabase/*|src/finance/*|src/domain/*|server/*)
                  database=true
                  ;;
              esac
            done < /tmp/changed-files.txt
          fi

          {
            echo "app=${app}"
            echo "browser=${browser}"
            echo "database=${database}"
            echo "dependencies=${dependencies}"
          } >> "${GITHUB_OUTPUT}"

          echo "[ci] app=${app} browser=${browser} database=${database} dependencies=${dependencies}"

      - name: Use Node.js
        if: steps.changes.outputs.app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.app == 'true'
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        if: steps.changes.outputs.app == 'true'
        run: npm run lint

      - name: Unit and integration tests
        if: steps.changes.outputs.app == 'true'
        run: npm test

      - name: Validate release public config contract
        if: steps.changes.outputs.app == 'true'
        env:
          VITE_SUPABASE_URL: https://release-contract.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_release_contract
        run: npm run check:release-config

      - name: Install Playwright Chromium
        if: steps.changes.outputs.browser == 'true'
        run: npx playwright install --with-deps chromium

      - name: Browser E2E smoke tests
        if: steps.changes.outputs.browser == 'true'
        run: npm run test:e2e

      - name: Secret scan
        run: npm run check:secrets

      - name: Dependency audit
        if: steps.changes.outputs.dependencies == 'true'
        run: npm audit --audit-level=high

      - name: Production build
        if: steps.changes.outputs.app == 'true'
        env:
          VITE_SUPABASE_URL: https://release-contract.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_release_contract
        run: npm run build

      - name: Generate release provenance manifest
        if: github.event_name == 'workflow_dispatch'
        env:
          VITE_SUPABASE_URL: https://release-contract.supabase.co
        run: npm run release:manifest

      - name: Retain exact release candidate artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: casa-finance-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  database-security:
    name: Supabase RLS and database contracts
    needs: validate
    if: needs.validate.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize local Supabase config
        run: test -f supabase/config.toml || supabase init

      - name: Start isolated Supabase and replay every migration from zero
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Run database behavior and security gates
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            supabase/tests/marco3_rls_security.test.sql
            supabase/tests/pr_a_mixed_external_responsibility.test.sql
            supabase/tests/pr_b_realized_expense_positions.test.sql
            supabase/tests/pr_c_wizard_idempotency.test.sql
            supabase/tests/pr_d_card_pix_integrity.test.sql
            supabase/tests/pr_e_settlement_integrity.test.sql
            supabase/tests/pr_f_recurring_expense_flow.test.sql
            supabase/tests/pr_g_recurring_horizon_anchor.test.sql
            supabase/tests/pr_h_card_direct_commitments.test.sql
            supabase/tests/pr_i_recurring_card_single.test.sql
            supabase/tests/pr_j_financial_onboarding_opening_positions.test.sql
            supabase/tests/pr_k_legacy_financial_cutover.test.sql
            supabase/tests/pr_l_release1_golden_journey.test.sql
            supabase/tests/pr_m_release1_everyday_extended.test.sql
            supabase/tests/pr_n_release1_reconciliation.test.sql
            supabase/tests/pr_o_homologacao_ux_income_member_identity.test.sql
            supabase/tests/pr_p_home_reference_month_read_model.test.sql
            supabase/tests/pr_q_national_business_calendar.test.sql
            supabase/tests/pr_r_member_settlement_performance.test.sql
          )

          for test_file in "${tests[@]}"; do
            echo "[db-gate] ${test_file}"
            supabase test db "${test_file}"
          done

      - name: Export local Supabase public connection settings
        run: |
          supabase status -o env > /tmp/supabase.env
          while IFS='=' read -r key value; do
            case "$key" in
              API_URL|PUBLISHABLE_KEY|ANON_KEY)
                value="${value#\"}"
                value="${value%\"}"
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < /tmp/supabase.env

      - name: Run Auth, app-surface and financial HTTP gates
        run: |
          set -euo pipefail
          bash supabase/tests/marco3_auth_http.sh
          bash supabase/tests/marco4_app_surface_http.sh
          bash supabase/tests/marco3_financial_http.sh
          bash supabase/tests/marco3_financial_isolation_http.sh
