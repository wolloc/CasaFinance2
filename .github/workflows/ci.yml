name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Validate release public config contract
        env:
          VITE_SUPABASE_URL: https://release-contract.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_release_contract
        run: npm run check:release-config

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E smoke tests
        run: npm run test:e2e

      - name: Secret scan
        run: npm run check:secrets

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Production build
        env:
          VITE_SUPABASE_URL: https://release-contract.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_release_contract
        run: npm run build

      - name: Generate release provenance manifest
        env:
          VITE_SUPABASE_URL: https://release-contract.supabase.co
        run: npm run release:manifest

      - name: Retain exact release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: casa-finance-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  database-security:
    name: Supabase RLS and database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize local Supabase config
        run: test -f supabase/config.toml || supabase init

      - name: Start isolated Supabase and replay every migration from zero
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Run Marco 3 dynamic RLS security gate
        run: supabase test db supabase/tests/marco3_rls_security.test.sql

      - name: Run PR A mixed external responsibility behavior gate
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/pr_a_mixed_external_responsibility.test.sql 2>&1 | tee pr-a-db-test.log

      - name: Retain PR A database test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-a-db-test-log-${{ github.sha }}
          path: pr-a-db-test.log
          if-no-files-found: warn
          retention-days: 3

      - name: Run PR B realized expense positions behavior gate
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/pr_b_realized_expense_positions.test.sql 2>&1 | tee pr-b-db-test.log

      - name: Retain PR B database test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-b-db-test-log-${{ github.sha }}
          path: pr-b-db-test.log
          if-no-files-found: warn
          retention-days: 3

      - name: Run PR C wizard idempotency behavior gate
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/pr_c_wizard_idempotency.test.sql 2>&1 | tee pr-c-db-test.log

      - name: Retain PR C database test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-c-db-test-log-${{ github.sha }}
          path: pr-c-db-test.log
          if-no-files-found: warn
          retention-days: 3

      - name: Run PR D card and card PIX behavior gate
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/pr_d_card_pix_integrity.test.sql 2>&1 | tee pr-d-db-test.log

      - name: Retain PR D database test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-d-db-test-log-${{ github.sha }}
          path: pr-d-db-test.log
          if-no-files-found: warn
          retention-days: 3

      - name: Run PR E settlement integrity behavior gate
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/pr_e_settlement_integrity.test.sql 2>&1 | tee pr-e-db-test.log

      - name: Retain PR E database test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-e-db-test-log-${{ github.sha }}
          path: pr-e-db-test.log
          if-no-files-found: warn
          retention-days: 3

      - name: Run PR F recurring expense behavior gate
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/pr_f_recurring_expense_flow.test.sql 2>&1 | tee pr-f-db-test.log

      - name: Retain PR F database test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-f-db-test-log-${{ github.sha }}
          path: pr-f-db-test.log
          if-no-files-found: warn
          retention-days: 3

      - name: Run PR G recurring horizon and month-anchor behavior gate
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/pr_g_recurring_horizon_anchor.test.sql 2>&1 | tee pr-g-db-test.log

      - name: Retain PR G database test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-g-db-test-log-${{ github.sha }}
          path: pr-g-db-test.log
          if-no-files-found: warn
          retention-days: 3

      - name: Run PR H card direct commitment behavior gate
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/pr_h_card_direct_commitments.test.sql 2>&1 | tee pr-h-db-test.log

      - name: Retain PR H database test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-h-db-test-log-${{ github.sha }}
          path: pr-h-db-test.log
          if-no-files-found: warn
          retention-days: 3

      - name: Export local Supabase public connection settings
        run: |
          supabase status -o env > /tmp/supabase.env
          while IFS='=' read -r key value; do
            case "$key" in
              API_URL|PUBLISHABLE_KEY|ANON_KEY)
                value="${value#\"}"
                value="${value%\"}"
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < /tmp/supabase.env

      - name: Run Marco 3 Auth JWT and PostgREST gate
        run: bash supabase/tests/marco3_auth_http.sh

      - name: Run Marco 4 app-surface PostgREST gate
        run: bash supabase/tests/marco4_app_surface_http.sh

      - name: Run Marco 3 real financial HTTP gate
        run: bash supabase/tests/marco3_financial_http.sh

      - name: Run Marco 3 financial isolation HTTP gate
        run: bash supabase/tests/marco3_financial_isolation_http.sh
