name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/atualizar-modal-de-lancamento-para-contas-fixas
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
