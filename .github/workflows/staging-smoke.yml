name: Staging smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA to homologate; empty uses the selected ref
        required: false
        type: string

permissions:
  contents: read

jobs:
  staging-smoke:
    name: Validate real staging boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      VITE_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      RELEASE_COMMIT_SHA: ${{ inputs.release_sha || github.sha }}

    steps:
      - name: Validate exact release SHA input
        run: |
          if [[ ! "${RELEASE_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'release_sha must be a full lowercase 40-character commit SHA' >&2
            exit 1
          fi

      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT_SHA }}

      - name: Confirm checked out commit
        run: test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT_SHA}"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate staging public configuration
        run: node scripts/validate-release-env.mjs

      - name: Probe Supabase Auth boundary
        run: |
          curl --fail-with-body --silent --show-error \
            -H "apikey: ${VITE_SUPABASE_PUBLISHABLE_KEY}" \
            "${VITE_SUPABASE_URL%/}/auth/v1/settings" \
            | node -e "let s=''; process.stdin.on('data',c=>s+=c); process.stdin.on('end',()=>{const x=JSON.parse(s); if(!x || typeof x!=='object') process.exit(1); console.log('[staging-smoke] Auth boundary responded with valid JSON');});"

      - name: Probe protected PostgREST boundary as anonymous
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            -H "apikey: ${VITE_SUPABASE_PUBLISHABLE_KEY}" \
            "${VITE_SUPABASE_URL%/}/rest/v1/households?select=id&limit=1")"

          case "$status" in
            401|403)
              echo "[staging-smoke] anonymous household read is fail-closed with HTTP $status"
              ;;
            200)
              node -e "const fs=require('node:fs'); const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(!Array.isArray(x) || x.length!==0){console.error('[staging-smoke] anonymous request unexpectedly saw household data'); process.exit(1);} console.log('[staging-smoke] anonymous household read is fail-closed with empty HTTP 200 response');" "$response_file"
              ;;
            *)
              echo "[staging-smoke] unexpected anonymous household response: HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: Build exact release artifact for staging configuration
        run: npm install --no-audit --no-fund && npm run build

      - name: Generate exact staging provenance manifest
        run: npm run release:manifest

      - name: Retain exact staging candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: casa-finance-staging-${{ env.RELEASE_COMMIT_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
